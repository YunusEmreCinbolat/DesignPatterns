<div class="page">
  <section class="card">

    <h2>Add Product</h2>

    <div class="form-row">
      <select [(ngModel)]="selectedProductId" (change)="onProductChange()">
        <option value="">Select product</option>
        <option *ngFor="let p of products" [value]="p.id">
          {{ p.name }} — {{ p.price | currency }}
        </option>
      </select>

      <input
        type="number"
        min="1"
        [(ngModel)]="selectedQty"
        placeholder="Qty"
      />

      <button (click)="addToCart()">Add</button>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  </section>

  <section class="card">

    <h2>Cart Items</h2>

    <div *ngIf="cartItems.length === 0" class="empty">
      Cart is empty.
    </div>

    <div *ngFor="let item of cartItems; let i = index" class="cart-item">
      <span>{{ item.name }}</span>
      <span>x{{ item.quantity }}</span>
      <span>{{ item.price * item.quantity | currency }}</span>
      <button class="remove" (click)="removeItem(i)">✕</button>
    </div>

    <div class="divider"></div>

    <div class="subtotal">
      Subtotal: {{ cartSubtotal | currency }}
    </div>

    <label>Discount Type</label>
    <select [(ngModel)]="discountType">
      <option *ngFor="let t of discountTypes" [ngValue]="t">{{ getDiscountLabel(t) }}</option>
    </select>

    <button class="primary" (click)="calculate()" [disabled]="loading">
      {{ loading ? 'Calculating…' : 'Calculate Total' }}
    </button>

    <div *ngIf="result" class="result">
      <strong>Total:</strong> {{ result.finalTotal | currency }}
    </div>

  </section>

</div>
